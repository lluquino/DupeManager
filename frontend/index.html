<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DupeManager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <!-- App Container -->
    <div id="app">
        <!-- Login View (shown when not authenticated) -->
        <div id="login-view" class="hidden min-h-screen flex items-center justify-center">
            <div class="glass-card p-8 w-full max-w-md">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                        DupeManager
                    </h1>
                    <p class="text-slate-400 mt-2">Gestor de duplicados de Jellyfin</p>
                </div>
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Usuario</label>
                        <input type="text" id="login-username"
                            class="w-full px-4 py-2 bg-slate-800 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required autocomplete="username">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label>
                        <input type="password" id="login-password"
                            class="w-full px-4 py-2 bg-slate-800 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required autocomplete="current-password">
                    </div>
                    <div id="login-error" class="hidden text-red-400 text-sm"></div>
                    <button type="submit"
                        class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 rounded-lg font-medium transition-colors">
                        Entrar
                    </button>
                </form>
                <p class="text-slate-500 text-xs text-center mt-6">
                    Solo administradores de Jellyfin
                </p>
            </div>
        </div>

        <!-- Main App (shown when authenticated) -->
        <div id="main-view" class="hidden">
            <!-- Header -->
            <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40">
                <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                    <div class="flex items-center gap-6">
                        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                            DupeManager
                        </h1>
                        <nav class="hidden md:flex items-center gap-1">
                            <a href="#/" class="nav-link active" data-route="/">Dashboard</a>
                            <a href="#/episodes" class="nav-link" data-route="/episodes">Episodios</a>
                            <a href="#/movies" class="nav-link" data-route="/movies">Películas</a>
                            <a href="#/ignored" class="nav-link" data-route="/ignored">Ignorados</a>
                            <a href="#/settings" class="nav-link" data-route="/settings">Configuración</a>
                        </nav>
                    </div>
                    <div class="flex items-center gap-4">
                        <span id="user-name" class="text-sm text-slate-400"></span>
                        <button id="logout-btn" class="text-sm text-slate-400 hover:text-white transition-colors">
                            Salir
                        </button>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="max-w-7xl mx-auto px-4 py-6">
                <div id="content"></div>
            </main>
        </div>

        <!-- Toast Container -->
        <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2"></div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/episodes.js"></script>
    <script src="/js/movies.js"></script>
    <script src="/js/ignored.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/wizard.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
